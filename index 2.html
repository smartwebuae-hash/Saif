<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>عقود الإيجار — النود، العين</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B2A41;--paper:#F3F5F7;--card:#fff;--line:#D5DBE1;--mute:#5B6878;--red:#B42318;--redbg:#FDECEA;--amber:#B54708;--amberbg:#FEF4E6;--green:#1F7A4D;--greenbg:#E8F5EE;--gray:#6B7280;--graybg:#EEF0F3}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;font-size:16px;line-height:1.6}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid #2F6FEB;outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
/* login */
#gate{min-height:100vh;display:grid;place-items:center;padding:24px}
#gate form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 22px;width:100%;max-width:360px}
#gate h1{font-size:1.35rem;margin:0 0 4px}
#gate p{margin:0 0 20px;color:var(--mute);font-size:.92rem}
#gate label{display:block;font-size:.9rem;margin:12px 0 4px}
#gate input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
#gate button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:8px;background:var(--ink);color:#fff;font-weight:700;cursor:pointer}
#err{color:var(--red);font-size:.9rem;min-height:1.4em;margin-top:10px}
/* header */
header h1{font-size:1.5rem;margin:0}
header .sub{color:var(--mute);font-size:.92rem;margin:2px 0 0}
.totals{display:flex;flex-wrap:wrap;gap:6px 18px;margin:14px 0 0;font-size:.95rem}
.totals b{font-weight:700}
/* deadlines */
.due{margin:26px 0 8px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.due h2{font-size:1.1rem;margin:0;padding:14px 16px;border-bottom:1px solid var(--line)}
.due ol{list-style:none;margin:0;padding:0}
.due li{display:grid;grid-template-columns:74px 1fr;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.due li:last-child{border-bottom:0}
.days{text-align:center;border-radius:10px;padding:6px 4px;line-height:1.15}
.days strong{display:block;font-size:1.55rem}
.days small{font-size:.72rem}
.days.red{background:var(--redbg);color:var(--red)}
.days.amber{background:var(--amberbg);color:var(--amber)}
.due .what{font-weight:700}
.due .how{font-size:.88rem;color:var(--mute)}
.empty{padding:14px 16px;color:var(--mute)}
/* controls */
.controls{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;margin-top:18px}
#q{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:.9rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
/* buildings */
section.bld{margin-top:22px}
section.bld h2{font-size:1.05rem;margin:0 0 8px;color:var(--mute);font-weight:500}
details.unit{background:var(--card);border:1px solid var(--line);border-inline-start:6px solid var(--green);border-radius:10px;margin-bottom:10px}
details.unit.s-exp,details.unit.s-closed{border-inline-start-color:var(--red);background:#FFFBFA}
details.unit.s-soon{border-inline-start-color:var(--amber)}
summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px}
summary::-webkit-details-marker{display:none}
.uname{font-size:1.2rem;font-weight:700}
.tenant{grid-column:1;color:var(--mute);font-size:.92rem}
.pill{grid-row:1;grid-column:2;align-self:start;font-size:.8rem;font-weight:700;border-radius:6px;padding:2px 9px;white-space:nowrap}
.rent{grid-column:2;text-align:end;font-size:.92rem;white-space:nowrap}
.p-exp,.p-closed{background:var(--redbg);color:var(--red)}
.p-soon{background:var(--amberbg);color:var(--amber)}
.p-ok{background:var(--greenbg);color:var(--green)}
.body{padding:0 14px 14px;border-top:1px dashed var(--line)}
dl{display:grid;grid-template-columns:minmax(120px,40%) 1fr;margin:12px 0 0;font-size:.93rem}
dt,dd{margin:0;padding:6px 0;border-bottom:1px solid #EDF0F3}
dt{color:var(--mute)}
dd{font-weight:500;overflow-wrap:anywhere}
.na{color:var(--gray);font-weight:400}
.note{margin:12px 0 0;padding:10px 12px;border-radius:8px;background:var(--graybg);font-size:.9rem}
.note.chq{background:var(--amberbg)}
.note ul{margin:4px 0 0;padding-inline-start:18px}
.note b{display:block}
a.tel{color:inherit}
.noresult{color:var(--mute);padding:20px 0}
footer{margin-top:30px;color:var(--mute);font-size:.82rem}
.logout{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:.85rem;cursor:pointer}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.gal button{padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;cursor:zoom-in;aspect-ratio:3/4}
.gal img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.galh{margin:14px 0 0;font-weight:700;font-size:.92rem}
#lb{position:fixed;inset:0;background:rgba(15,23,34,.92);z-index:50;display:none;flex-direction:column}
#lb.on{display:flex}
#lb .bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;color:#fff}
#lb .bar button{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:4px 12px;cursor:pointer}
#lb .view{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;text-align:center}
#lb img{max-width:100%;height:auto}
.call{display:inline-flex;align-items:center;gap:6px;background:var(--green);color:#fff;text-decoration:none;font-weight:700;font-size:.9rem;border-radius:8px;padding:6px 12px;white-space:nowrap}
.call svg{width:16px;height:16px;fill:currentColor}
.sumcall{grid-column:1/-1;margin-top:8px}
.due .call{margin-top:6px;padding:4px 10px;font-size:.82rem}
dd .call{margin-inline-start:8px;padding:3px 10px;font-size:.82rem}
@media print{.controls,.logout,#gate{display:none!important}details.unit{break-inside:avoid}details.unit .body{display:block}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

.top{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px}
.tbtn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 12px;font-size:.85rem;cursor:pointer}
#gate .lang{margin:0 0 14px;width:auto;background:#fff;color:var(--ink);border:1px solid var(--line);padding:4px 12px;font-weight:500;font-size:.85rem}
.acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.wa{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#0E5C4E;border:1.5px solid #0E5C4E;font-weight:700;font-size:.9rem;border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.wa svg{width:16px;height:16px;fill:currentColor}
.wa[data-state=busy]{opacity:.6;cursor:progress}
.wa[data-state=ready]{background:#0E5C4E;color:#fff}
.body .acts{margin-top:14px}
.wac,.wac:visited{background:#1DA851!important;color:#fff}
.wac svg{width:16px;height:16px;fill:currentColor}
#toast{position:fixed;inset-inline:16px;bottom:16px;max-width:520px;margin:0 auto;background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;font-size:.9rem;z-index:95;display:none}
#toast.on{display:block}

.addb{background:var(--ink)!important;color:#fff!important;border-color:var(--ink)!important;font-weight:700}
.dirty{background:#FEF4E6;border:1px solid #F5C98B;border-radius:10px;padding:10px 12px;margin:0 0 14px;font-size:.88rem}
.dirty p{margin:0 0 8px;color:#7A3E00}.dirty div{display:flex;gap:8px;flex-wrap:wrap}
.dirty button,.edbtns button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-size:.88rem;cursor:pointer}
.pri{background:var(--ink)!important;color:#fff;border-color:var(--ink)!important;font-weight:700}
.edrow{display:flex;gap:8px;margin:12px 0 4px}
.edb{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.edb.del{color:#B42318;border-color:#F3C4C0}
.np{font-size:.9rem!important;grid-column:1/-1;justify-self:start;margin:2px 0 4px;background:#FDECEA;color:#C62828;border:1px solid #F5B5AE;border-radius:999px;padding:1px 10px;font-size:.82rem;font-weight:700;white-space:nowrap}
.pays{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;font-size:.92rem}
.pays .ph{font-weight:700;color:var(--ink)}.pays .ph small{font-weight:400;color:var(--mute)}
.pd{background:#F1F3F6;border:1px solid var(--line);border-radius:7px;padding:2px 8px;font-weight:600;color:var(--ink);direction:ltr;unicode-bidi:isolate}
.pd.past{color:#9AA4B1;text-decoration:line-through;background:#F7F8FA}
.pd.nx{background:#C62828;border-color:#C62828;color:#fff}
.auto{background:#EEF6F1;border:1px dashed #1F7A4D;border-radius:10px;padding:10px 12px;margin-bottom:12px}.auto p{margin:4px 0 8px;font-size:.85rem;color:#33503F}.auto #autoSt{margin:8px 0 0;color:#1F7A4D;font-weight:600}
#edForm .filled{background:#E3F4EA;border-color:#1F7A4D}
.pdft{display:flex;align-items:center;justify-content:center;flex-direction:column;width:100%;height:100%;background:#FDECEC;color:#B42318;font-weight:700;text-decoration:none;font-size:.85rem;text-align:center}
.gal .gpdf{width:84px;height:110px;border-radius:8px;border:1px solid var(--line)}
#imModal{position:fixed;inset:0;background:rgba(15,23,35,.55);z-index:70;display:none;overflow:auto;padding:16px}
#imModal.on{display:block}
.th.big{width:96px;height:128px}.th img{cursor:zoom-in}.th .ix{position:absolute;bottom:2px;inset-inline-start:4px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;border-radius:4px;padding:0 4px}
.muted{color:#5B6878;font-size:.9rem}
#imModal .edbtns{align-items:center}
#lb{z-index:90}
#edModal{position:fixed;inset:0;background:rgba(15,23,35,.55);z-index:70;display:none;overflow:auto;padding:16px}
#edModal.on{display:block}
.edbox{background:#fff;max-width:640px;margin:0 auto;border-radius:14px;padding:16px 16px 20px}
.edbox h2{margin:0 0 12px;font-size:1.15rem}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.fg{grid-template-columns:1fr}}
#edForm label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:#5B6878}
#edForm label.full,#edForm div.full{margin-top:10px}
#edForm input,#edForm select,#edForm textarea{font:inherit;font-size:.95rem;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;width:100%;box-sizing:border-box}
#edForm .lbl{font-size:.82rem;color:#5B6878}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.th{position:relative;width:74px;height:98px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.th button{position:absolute;top:2px;inset-inline-end:2px;width:22px;height:22px;border-radius:50%;border:0;background:#B42318;color:#fff;font-size:15px;line-height:20px;cursor:pointer;padding:0}
.addimg{display:inline-block!important;border:1px dashed var(--ink);border-radius:8px;padding:6px 12px;color:var(--ink)!important;cursor:pointer;font-weight:700}
.err{color:#B42318;margin:10px 0 0;font-size:.88rem;min-height:1em}
.edbtns{display:flex;gap:8px;margin-top:10px}
.edbtns .pri{padding:8px 22px}

.mdl{position:fixed;inset:0;background:rgba(15,23,35,.55);z-index:75;display:none;overflow:auto;padding:16px}.mdl.on{display:block}
.mh{display:flex;justify-content:space-between;align-items:center}.mh h2{margin:0}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 10px}
.tb{border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-weight:700;font-size:.9rem;cursor:pointer}
.dcards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dc{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:start;background:#fff;font:inherit;cursor:pointer;line-height:1.3}
.dc small{display:block;font-size:.75rem;color:var(--mute)}.dc b{font-size:1.15rem}
.dc.g b{color:#1F7A4D}.dc.a b{color:#B54708}.dc.r b{color:#C62828}
@media(max-width:420px){.dc b{font-size:1rem}}
.paybox{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px}
.payh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.ptab{width:100%;border-collapse:collapse;font-size:.9rem}.ptab td{border-top:1px solid #EDF0F3;padding:6px 4px;vertical-align:middle}
.ptab tr.nxr td{background:#FDECEA}.ptab .pa{white-space:nowrap;text-align:end}
.n{direction:ltr;unicode-bidi:isolate;white-space:nowrap}.small{font-size:.8rem}
.ib{border:1px solid var(--line);background:#fff;border-radius:7px;width:32px;height:30px;cursor:pointer;margin-inline-start:4px}
.sc{display:inline-block;border-radius:6px;padding:1px 8px;font-size:.78rem;font-weight:700;white-space:nowrap}
.sc-pending{background:#FEF4E6;color:#B54708}.sc-received,.sc-deposited,.sc-cash{background:#E3F4EA;color:#1F7A4D}.sc-bounced{background:#C62828;color:#fff}.sc-assumed{background:#F1F3F6;color:#6B7280}
.pd.paid{background:#E3F4EA;border-color:#9FD4B6;color:#1F7A4D}.pd.bnc{background:#fff;border:2px solid #C62828;color:#C62828}.pd.late{border:2px solid #C62828;color:#C62828}
.dangerb{color:#B42318!important;border-color:#F3C4C0!important}
.dsum{margin:10px 0;font-size:.95rem}.ditem{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.dd{font-weight:700;color:#C62828}.dact{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}.dact .call{margin:0}
.rl{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--mute)}.rl select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px}
#printArea{display:none}
@media print{
 @page{size:A4 landscape;margin:10mm}
 body.printing>*:not(#printArea){display:none!important}
 body.printing #printArea{display:block!important;font-size:9.5px;color:#1B2A41}
 #printArea h1{font-size:18px;margin:0 0 2px;color:#B42318}#printArea .rsub{margin:0 0 8px;color:#5B6878;font-size:9px}
 .rt{width:100%;border-collapse:collapse;margin-bottom:10px;break-inside:auto}.rt th,.rt td{border:1px solid #C9D1DB;padding:3px 4px;text-align:start}
 .rt thead tr:last-child th{background:#1B2A41;color:#fff}.rt .rg th{background:#C62828;color:#fff;font-size:11px}
 .rt .rs td{background:#FDECEC;color:#B42318;font-weight:700}.rp{font-weight:700}.rp-exp,.rp-closed{color:#B42318}.rp-soon{color:#B54708}.rp-ok{color:#1F7A4D}
 .rgrand{font-size:12px;color:#B42318}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

const KIND_EN={"مكتب":"Office","محل":"Shop","ورشة":"Workshop","مستودع":"Warehouse"};
const UNIT_EN={"مكتب":"Office","محل":"Shop","شبرة":"Shed","مستودع":"Warehouse"};
const METHOD_EN={"شيكات":"cheques","نقدي وشيكات":"cash and cheques"};
const REG_EN={"سجل الإيجارات":"Rental Registry","السجل العقاري":"Real Estate Registry"};

let lang="ar";
try{const s=localStorage.getItem("lang");if(s==="en"||s==="ar")lang=s}catch(e){}
const L=()=>T[lang];

const $=s=>document.querySelector(s);
const fmt=n=>n.toLocaleString("en-US");
const d=s=>new Date(s+"T00:00:00");
const dmy=s=>{const [y,m,dd]=s.split("-");return `${+dd}/${+m}/${y}`};
const today=new Date();today.setHours(0,0,0,0);
const DAY=864e5;
const addDays=(dt,n)=>new Date(dt.getTime()+n*DAY);
const iso=dt=>{const z=new Date(dt.getTime()-dt.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// localized fields
const unitOf=c=>{if(lang==="ar")return c.unit;if(c.unit_en)return c.unit_en;const [w,...r]=c.unit.split(" ");return (UNIT_EN[w]||w)+(r.length?" "+r.join(" "):"")};
const tenantOf=c=>lang==="en"&&c.tenant_en?c.tenant_en:c.tenant;
const kindOf=c=>lang==="en"?(KIND_EN[c.kind]||c.kind):c.kind;
const methodOf=c=>lang==="en"?(METHOD_EN[c.method]||c.method):c.method;
const regOf=c=>lang==="en"?(REG_EN[c.registry]||c.registry):c.registry;
const notesOf=c=>lang==="en"&&c.notes_en?c.notes_en:c.notes;
const chequeOf=c=>lang==="en"&&c.cheque_en?c.cheque_en:c.cheque;
const plotName=p=>PLOTS[lang][p];

const ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>';
const DOC='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm7 1.5V9h5.5L13 3.5zM8 13v2h8v-2H8zm0 4v2h5v-2H8z"/></svg>';
const telOf=p=>(!p||p==="—")?null:"+"+p.replace(/^\+/,"").replace(/^0/,"971");
const waNum=p=>{const t=telOf(p);return t?t.slice(1):""};
const CHAT='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 2a8 8 0 1 1-4.1 14.9l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 0 1 12 4zm-3.2 4c-.2 0-.5.1-.7.3-.3.3-.9.9-.9 2.1s.9 2.4 1 2.6c.1.2 1.8 2.8 4.4 3.8 2.1.8 2.6.7 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.5-.3-1.7-.8c-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1-.3-.1-1.1-.4-2-1.2-.8-.7-1.3-1.5-1.4-1.8-.2-.3 0-.4.1-.5l.4-.4.2-.4v-.4l-.8-1.9c-.2-.5-.4-.4-.5-.4h-.5z"/></svg>';
const waChatBtn=p=>{const n=waNum(p);return n?`<a class="call wac" href="https://wa.me/${n}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${CHAT}${L().waChat}</a>`:""};
const callBtn=p=>{const t=telOf(p);return t?`<a class="call" href="tel:${t}" onclick="event.stopPropagation()">${ICON}${L().call}</a>`:""};
const waBtn=c=>`<button type="button" class="wa" data-wa="${c.no}">${DOC}<span>${L().wa}</span></button>`;

function status(c){
  const end=d(c.end), left=Math.round((end-today)/DAY), close=addDays(end,90), toClose=Math.round((close-today)/DAY);
  if(left<0) return toClose<0?{k:"closed",left,toClose,close}:{k:"exp",left,toClose,close};
  if(left<=60) return {k:"soon",left,toClose,close};
  return {k:"ok",left,toClose,close};
}
const stText=k=>({closed:L().stClosed,exp:L().stExp,soon:L().stSoon,ok:L().stOk}[k]);
DATA.forEach(c=>c.st=status(c));

function row(k,v){const e=(v===undefined||v===null||v===""||v==="—"||v==="غير متوفر");return `<dt>${k}</dt><dd${e?' class="na"':''}>${e?L().na:v}</dd>`}
const PAID=new Set(["received","deposited","cash"]);
function eqAmounts(c){const n=Math.max(1,+c.n||1),v=Number(c.value)||0,b=Math.round(v/n);return Array.from({length:n},(_,i)=>i<n-1?b:v-b*(n-1))}
function baseDates(c){if(Array.isArray(c.pays)&&c.pays.length)return c.pays.slice().sort();
  const s=d(c.start),e=d(c.end),span=e-s,n=Math.max(1,+c.n||1),out=[];for(let i=0;i<n;i++)out.push(iso(new Date(s.getTime()+span*i/n)));return out}
function isEst(c){return !(Array.isArray(c.payments)&&c.payments.length)}
function payments(c){
  if(!isEst(c))return c.payments.slice().sort((a,b)=>a.date<b.date?-1:1);
  const t=iso(today),ds=baseDates(c),am=eqAmounts(c);
  return ds.map((date,i)=>({date,amount:am[i]??am[am.length-1],status:date<t?"assumed":"pending",est:true}))}
function ensurePayments(c){if(isEst(c))c.payments=payments(c).map(p=>p.status==="assumed"?{date:p.date,amount:p.amount,status:"received",auto:true}:{date:p.date,amount:p.amount,status:"pending"});c.payments.sort((a,b)=>a.date<b.date?-1:1);return c.payments}
function schedISO(c){return payments(c).map(p=>p.date)}
function scheduleArr(c){return schedISO(c).map(dmy)}
function nextPay(c){const ps=payments(c);const i=ps.findIndex(p=>p.status==="pending"||p.status==="bounced");if(i<0)return null;const p=ps[i];return {i,date:p.date,amount:p.amount,status:p.status,days:Math.round((d(p.date)-today)/DAY)}}
function paysHtml(c){
  const ps=payments(c),np=nextPay(c),est=isEst(c),t=iso(today);
  return `<span class="pays"><span class="ph">${L().paysT}${est?` <small>(${L().estW})</small>`:""}:</span>${ps.map((p,i)=>{
    const cls=np&&i===np.i?" nx":p.status==="bounced"?" bnc":PAID.has(p.status)?" paid":p.status==="assumed"?" past":(p.date<t?" late":"");
    return `<span class="pd${cls}">${PAID.has(p.status)?"✓ ":p.status==="bounced"?"✗ ":""}${dmy(p.date)}</span>`}).join("")}</span>`}
function npBadge(c){const np=nextPay(c);if(!np)return "";const X=LX();
  const when=np.days<0?X.lateBy(-np.days):np.days===0?L().todayW:L().inDays(np.days);
  return `<span class="np">● ${np.status==="bounced"?X.bouncedW:L().nextPay}: ${dmy(np.date)} · ${L().aed(fmt(np.amount))} · ${when}</span>`}
function card(c){
  const st=c.st, per=Math.round(c.value/c.n), R=L().r;
  const phone=telOf(c.phone)?`${c.phone} ${callBtn(c.phone)} ${waChatBtn(c.phone)}`:c.phone;
  const when = st.left<0 ? L().ago(-st.left) : L().left(st.left);
  const ns=notesOf(c), ch=chequeOf(c);
  const notes=ns.length?`<div class="note"><b>${L().notes}</b><ul>${ns.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>`:"";
  const chq=ch?`<div class="note chq"><b>${L().cheque}</b>${esc(ch)}</div>`:"";
  const tn=c.tenant==="غير متوفر"?L().unknownTenant:tenantOf(c);
  const imgs=(c.imgs||[]).length;
  return `<details class="unit s-${st.k}">
  <summary><span class="uname">${unitOf(c)}</span><span class="pill p-${st.k}">${stText(st.k)}</span>${npBadge(c)}
  <span class="tenant">${esc(tn)}</span><span class="rent">${fmt(c.annual)} ${L().perYear}</span>
  ${paysHtml(c)}
  <span class="acts">${callBtn(c.phone)}${waChatBtn(c.phone)}${waBtn(c)}</span></summary>
  <div class="body"><dl>
  ${row(R.no,c.no)}${row(R.tenant,esc(tenantOf(c)))}${row(R.phone,phone)}
  ${row(R.reg,c.reg)}${row(R.premise,c.premise)}${row(R.kind,kindOf(c))}${row(R.area,c.area)}
  ${row(R.issue,dmy(c.issue))}${row(R.start,dmy(c.start))}${row(R.end,dmy(c.end)+" — "+when)}
  ${row(R.annual,L().aed(fmt(c.annual)))}${row(R.value,L().aed(fmt(c.value)))}

const FONT='"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif';
function drawSummary(c){
  const W=1240,H=1754,M=96,rtl=lang==="ar",R=L().r;
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;
  const x=cv.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,W,H);
  x.direction=rtl?"rtl":"ltr";x.textAlign="start";x.textBaseline="top";
  const X0=rtl?W-M:M, sign=rtl?-1:1;
  const wrap=(txt,maxW)=>{const words=String(txt).split(" "),lines=[];let cur="";
    words.forEach(w=>{const t=cur?cur+" "+w:w;if(x.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t});
    if(cur)lines.push(cur);return lines};
  // header band
  x.fillStyle="#1B2A41";x.fillRect(0,0,W,210);
  x.fillStyle="#fff";x.font=`700 50px ${FONT}`;x.fillText(L().pdfTitle,X0,56);
  x.font=`400 24px ${FONT}`;x.fillStyle="#D5DBE1";
  wrap(`${L().pdfLessor}: ${LESSOR[lang]}`,W-2*M).forEach((l,i)=>x.fillText(l,X0,128+i*32));
  // rows
  const per=Math.round(c.value/c.n);
  const rows=[[R.no,c.no],[R.unit,unitOf(c)],[R.bld,plotName(c.plot)||"—"],[R.tenant,tenantOf(c)],
    [R.start,dmy(c.start)],[R.end,dmy(c.end)],[R.annual,L().aed(fmt(c.annual))],[R.value,L().aed(fmt(c.value))],
    [R.n,`${c.n} (${methodOf(c)})`],[R.per,L().aed(fmt(per))],[R.sched,scheduleArr(c).join(rtl?"، ":", ")],[R.registry,regOf(c)]];
  const labW=360, valX=X0+sign*(labW+24), valW=W-2*M-labW-24;
  let y=262;
  rows.forEach(([k,v])=>{
    x.font=`500 26px ${FONT}`;const vl=wrap(v,valW);
    const h=Math.max(1,vl.length)*38+28;
    x.fillStyle="#5B6878";x.font=`400 24px ${FONT}`;x.fillText(k,X0,y+16);
    x.fillStyle="#1B2A41";x.font=`500 26px ${FONT}`;vl.forEach((l,i)=>x.fillText(l,valX,y+14+i*38));
    y+=h;x.fillStyle="#E3E7EC";x.fillRect(M,y,W-2*M,2);
  });
  // status note for tenant
  y+=36;
  const endMsg=c.st.left<0?L().pdfEnded(dmy(c.end)):(c.st.left<=60?L().pdfEnds(dmy(c.end)):"");
  if(endMsg){x.font=`700 26px ${FONT}`;const ls=wrap(endMsg,W-2*M-48);const bh=ls.length*38+36;
    x.fillStyle="#FEF4E6";x.fillRect(M,y,W-2*M,bh);x.fillStyle="#B54708";ls.forEach((l,i)=>x.fillText(l,X0+sign*24,y+18+i*38));y+=bh+28}
  x.font=`400 22px ${FONT}`;x.fillStyle="#5B6878";
  wrap(L().pdfNote,W-2*M).forEach(l=>{x.fillText(l,X0,y);y+=32});
  // footer
  x.fillStyle="#E3E7EC";x.fillRect(M,H-150,W-2*M,2);
  x.fillStyle="#1B2A41";x.font=`500 24px ${FONT}`;
  x.fillText(L().pdfContact("\u2066+"+LESSOR_PHONE+"\u2069"),X0,H-122);
  x.fillStyle="#5B6878";x.font=`400 22px ${FONT}`;x.fillText(L().pdfDate(dmy(iso(today))),X0,H-84);
  return cv;
}
// minimal PDF writer: one A4 page with a JPEG image (no external libraries)
function jpegToPdf(bytes,wPx,hPx){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=b=>{const u=typeof b==="string"?enc.encode(b):b;parts.push(u);len+=u.length};
  const PW=595.28,PH=+(595.28*hPx/wPx).toFixed(2),content=`q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
  push("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  const obj=(n,s)=>{offs[n]=len;push(`${n} 0 obj\n${s}\nendobj\n`)};
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,"<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>`);
  obj(4,`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
  offs[5]=len;push(`5 0 obj\n<< /Type /XObject /Subtype /Image /Width ${wPx} /Height ${hPx} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`);
  push(bytes);push("\nendstream\nendobj\n");
  const xref=len;
  let xr="xref\n0 6\n0000000000 65535 f \n";for(let i=1;i<=5;i++)xr+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  push(xr+`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts,{type:"application/pdf"});
}
async function makePdf(c){
  try{await document.fonts.load(`700 20px "IBM Plex Sans Arabic"`);await document.fonts.load(`400 20px "IBM Plex Sans Arabic"`)}catch(e){}
  const cv=drawSummary(c);
  const jpg=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.92));
  const bytes=new Uint8Array(await jpg.arrayBuffer());
  return new File([jpegToPdf(bytes,cv.width,cv.height)],`contract-${c.no}-${lang}.pdf`,{type:"application/pdf"});
}

async function deliver(c,file){
  const text=L().msg(tenantOf(c),c.no,unitOf(c),dmy(c.end));
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    await navigator.share({files:[file],text});   // user picks WhatsApp and the chat
    return;
  }
  // desktop / unsupported: download the PDF and open the tenant's chat with the message
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();
  const w=window.open(`https://wa.me/${waNum(c.phone)}?text=${encodeURIComponent(text)}`,"_blank");
  if(!w){const e=new Error("blocked");e.name="NotAllowedError";throw e}
  toast(L().waDl);
}

    setWa(c.no,"");
  }catch(err){
    if(err&&err.name==="AbortError"){setWa(c.no,"");return}
    if(err&&err.name==="NotAllowedError"&&PREPARED[c.no]){setWa(c.no,"ready");return} // tap again to send
    setWa(c.no,"");toast(L().waErr);

},true);

const PDFJS_URL="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.min.mjs";
const PDFJS_WORKER="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.worker.min.mjs";
const TESS_URL="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
let pdfjsP=null;
function loadPdfjs(){return pdfjsP||(pdfjsP=import(PDFJS_URL).then(m=>{m.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;return m}))}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("load "+src));document.head.appendChild(s)})}
const AR=/[\u0600-\u06FF\uFB50-\uFDFF\uFE70-\uFEFF]/;
const nz=s=>String(s).normalize("NFKC");
async function pdfRows(file){
  const pdfjs=await loadPdfjs();const doc=await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const rows=[];
  for(let p=1;p<=Math.min(doc.numPages,3);p++){const pg=await doc.getPage(p);const tc=await pg.getTextContent();const rs=[];
    for(const it of tc.items){if(!it.str||!it.str.trim())continue;const y=it.transform[5],x=it.transform[4];let r=rs.find(r=>Math.abs(r.y-y)<3);if(!r){r={y,items:[]};rs.push(r)}r.items.push({x,s:it.str.trim()})}
    rs.sort((a,b)=>b.y-a.y);rs.forEach(r=>{r.items.sort((a,b)=>a.x-b.x);rows.push(r.items.map(i=>i.s))})}
  return rows}
async function ocrRows(file){
  if(!window.Tesseract)await loadScript(TESS_URL);
  const {data}=await window.Tesseract.recognize(file,"eng");
  return data.text.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>l.split(/\s{2,}|\s*\|\s*/).filter(Boolean))}
function parseContract(rows){
  const R={},L=rows.map(r=>r.join(" | "));
  const after=(lab,re)=>{for(const l of L){const i=l.indexOf(lab);if(i>=0){const m=l.slice(i+lab.length).match(re);if(m)return m[1]}}};
  const num=s=>s==null?undefined:Number(String(s).replace(/,/g,""));
  R.no=after("Contract No",/(\d{9,15})/);
  R.issue=after("Issue Date",/(\d{4}-\d{2}-\d{2})/);
  R.start=after("Start Date",/(\d{4}-\d{2}-\d{2})/);
  R.end=after("End Date",/(\d{4}-\d{2}-\d{2})/);
  R.annual=num(after("Annual Rent",/([\d,]+(?:\.\d+)?)/));
  R.value=num(after("Contract Value",/([\d,]+(?:\.\d+)?)/));
  R.n=num(after("Number of Payments",/(\d+)/));
  const pm=after("Payment Method",/([A-Za-z][A-Za-z ]+)/);
  if(pm)R.method=/cash/i.test(pm)&&/cheque/i.test(pm)?"نقدي وشيكات":/cheque/i.test(pm)?"شيكات":/cash/i.test(pm)?"نقدي":undefined;
  if(L.some(l=>/Land Registry/i.test(l)))R.registry="السجل العقاري";else if(L.some(l=>/Rental Registry/i.test(l)))R.registry="سجل الإيجارات";
  R.plot=after("Plot No",/(\d+)/);
  const prp=L.join(" ").match(/PRP\d+/);if(prp)R.prp=prp[0];
  // tenant section
  const s=L.findIndex(l=>/TENANT DETAILS/i.test(l));
  if(s>=0){let e=L.findIndex((l,i)=>i>s&&/PROPERTY DETAILS/i.test(l));if(e<0)e=Math.min(L.length,s+14);
    const T=rows.slice(s+1,e),toks=T.flat();
    const ei=toks.findIndex(t=>t.includes("@"));
    if(ei>=0){let em=toks[ei];if(/[.@]$/.test(em)||!/\.[a-z]{2,}$/i.test(em)){const nx=toks.slice(ei+1).find(t=>/^[a-z.]{1,10}$/i.test(t));if(nx)em+=nx}R.email=em.replace(/\s/g,"")}
    const ph=toks.map(t=>t.replace(/\+/g,"").trim()).find(t=>/^(971\d{9}|05\d{8})$/.test(t));if(ph)R.phone=ph;
    const lic=toks.find(t=>/^(CN|TN)-\d+$/.test(t));if(lic)R.license=lic;
    const k=T.findIndex(r=>r.join(" ").match(/Reserved Trade Name/i));
    const part=k>=0?T.slice(k+1):T;
    const LBL=/^(Email|Mobile No\.?|License No\.?|Company Name|Full Name|Emirates ID No\.?|Nationality|Reserved Trade (Name|No\.?)|TENANT DETAILS|1\.)$/i;
    const en=part.flat().filter(t=>/[A-Z]/.test(t)&&t===t.toUpperCase()&&!AR.test(t)&&!LBL.test(t)&&!t.includes("@")&&!/^(CN|TN)-/.test(t)&&!/^\+?\d[\d\s]*\+?$/.test(t)&&!/^(COM|C)$/i.test(t));
    if(en.length)R.tenant_en=en.join(" ").replace(/\s+/g," ").replace(/\s*-\s*$/,"").trim();
    const HDR=/(البريد|الهاتف|الرخصة|اسم|الشركة|تفاصيل|المستأجر|الهوية|الجنسية|الكامل|التجاري|المحجوز|الطرف)/;
    const arRows=part.filter(r=>r.length&&r.every(t=>AR.test(t)||/^[\s.\-()]+$/.test(t))).map(r=>nz(r.slice().reverse().join(" "))).filter(t=>!HDR.test(t)&&t.replace(/[^\u0600-\u06FF]/g,"").length>3);
    if(arRows.length){let a=arRows[k>=0?arRows.length-1:0];a=a.replace(/\s*\.\s*/g,".").replace(/\s*-\s*/g," - ").replace(/\s+/g," ").trim();R.tenant=a}
  }
  // unit row
  const ui=rows.findIndex(r=>r.some(t=>/^UNT\d+$/.test(t)));
  if(ui>=0){const r=rows[ui],k=r.findIndex(t=>/^UNT\d+$/.test(t));R.reg=r[k];
    const before=r.slice(0,k).filter(t=>/^\d+$/.test(t));const pr=before.find(t=>t.length>=8);if(pr)R.premise=pr;
    const ar=before.filter(t=>t!==pr);if(ar.length)R.area=ar[ar.length-1];
    const u=nz(r.slice(k+1).reverse().join(" ")).replace(/رقم/g,"").replace(/\s+/g," ").trim();if(u&&AR.test(u))R.unit=u;
    const near=[rows[ui-1],r,rows[ui+1]].filter(Boolean).flat().join(" ");
    R.kind=/WORKSHOP/.test(near)?"ورشة":/OFFICE/.test(near)?"مكتب":/STORE|WAREHOUSE/.test(near)?"مستودع":/SHOP/.test(near)?"محل":undefined;
  }else{
    const m=L.join(" ").match(/UNT\d{6,}/);if(m)R.reg=m[0];
  }
  Object.keys(R).forEach(k=>{if(R[k]===undefined||R[k]===""||Number.isNaN(R[k]))delete R[k]});
  return R;
}
async function readContractFiles(files,status){

  return R}

  const c=DATA.find(x=>x.no===pyNo);if(!c)return;const fd=new FormData(e.target),g=k=>String(fd.get(k)??"").trim();

  if(!p.date||!(p.amount>=0)){$("#pyErr").textContent=L().ed.required;return}
  const list=ensurePayments(c);if(pyIdx>=0)list[pyIdx]=p;else list.push(p);list.sort((a,b)=>a.date<b.date?-1:1);c.n=list.length;
  closeModal("#pyModal");await savePayments(c)});
async function quickStatus(no,idx,status){const c=DATA.find(x=>x.no===no);if(!c)return;const list=ensurePayments(c);if(!list[idx])return;list[idx].status=status;await savePayments(c);if($("#dueModal").classList.contains("on"))drawDue()}
/* ---- due list ---- */
let dueTab="d30";
function dueItems(tab){const t=iso(today),lim=iso(addDays(today,tab==="d90"?90:30)),out=[];
  DATA.forEach(c=>payments(c).forEach((p,i)=>{
    const late=(p.status==="bounced")||(p.status==="pending"&&p.date<t&&!p.est);
    if(tab==="late"?late:(p.status==="pending"&&p.date>=t&&p.date<=lim))out.push({c,p,i})}));
  return out.sort((a,b)=>a.p.date<b.p.date?-1:1)}
function drawDue(){const x=LX(),items=dueItems(dueTab),sum=items.reduce((a,o)=>a+(+o.p.amount||0),0);
  $("#dueTabs").innerHTML=["late","d30","d90"].map(k=>`<button type="button" class="chip" aria-pressed="${k===dueTab}" data-duetab="${k}">${x.tab[k]}</button>`).join("");
  $("#dueBody").innerHTML=`<p class="dsum">${x.total}: <b>${L().aed(fmt(sum))}</b> · ${items.length}</p>`+(items.length?items.map(({c,p,i})=>`<div class="ditem"><div class="dd n">${dmy(p.date)}</div><div class="dm"><b>${esc(unitOf(c))}</b> — ${esc(tenantOf(c))}<br><span class="n">${L().aed(fmt(p.amount))}</span> ${stChip(p.status)} ${p.chq?`<span class="muted small">#${esc(p.chq)}${p.bank?" · "+esc(p.bank):""}</span>`:""}
   <div class="dact"><button type="button" class="edb" data-quick="${c.no}|${i}|deposited">${x.mkDep}</button><button type="button" class="edb del" data-quick="${c.no}|${i}|bounced">${x.mkBnc}</button><button type="button" class="ib" data-pay="${c.no}|${i}">✎</button>${callBtn(c.phone)}</div></div></div>`).join(""):`<p class="muted">${x.none}</p>`)}
function openDue(tab){dueTab=tab||dueTab;$("#dueTitle").textContent=LX().dueT;drawDue();$("#dueModal").classList.add("on");document.body.style.overflow="hidden"}
/* ---- calendar (.ics) ---- */
function icsDate(s){return s.replace(/-/g,"")}
function icsEsc(s){return String(s).replace(/[\\;,]/g,m=>"\\"+m).replace(/\n/g,"\\n")}
function buildIcs(){const x=LX(),t=iso(today),L1=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//rent-alnoud//AR","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:"+icsEsc(lang==="ar"?"عقود الإيجار — النود":"Al Noud rents")];
  const ev=(uid,date,title,desc,alarmDays)=>{const dt=icsDate(date),nx=icsDate(iso(addDays(d(date),1)));
    L1.push("BEGIN:VEVENT","UID:"+uid+"@rent-alnoud","DTSTAMP:"+icsDate(t)+"T000000Z","DTSTART;VALUE=DATE:"+dt,"DTEND;VALUE=DATE:"+nx,"SUMMARY:"+icsEsc(title),"DESCRIPTION:"+icsEsc(desc),
      "BEGIN:VALARM","TRIGGER:-P"+alarmDays+"D","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(title),"END:VALARM","END:VEVENT")};
  DATA.forEach(c=>{const u=unitOf(c),tn=tenantOf(c);
    payments(c).forEach((p,i)=>{if((p.status==="pending"||p.status==="bounced")&&p.date>=t)ev(`p-${c.no}-${p.date}-${i}`,p.date,`${x.calPay}: ${u} — ${L().aed(fmt(p.amount))}`,`${tn}\n${c.no}${p.chq?"\n#"+p.chq:""}`,1)});
    if(c.end>=t)ev(`e-${c.no}-${c.end}`,c.end,`${x.calEnd}: ${u}`,`${tn}\n${c.no}`,30);
    const reg=iso(addDays(d(c.end),90));if(reg>=t)ev(`r-${c.no}-${reg}`,reg,`${x.calReg}: ${u}`,`${tn}\n${c.no}`,14)});
  L1.push("END:VCALENDAR");return L1.join("\r\n")}
function exportIcs(){const blob=new Blob([buildIcs()],{type:"text/calendar"});const url=URL.createObjectURL(blob);
  const ios=/iP(hone|ad|od)/.test(navigator.userAgent);
  if(ios){location.href=url}else{const a=document.createElement("a");a.href=url;a.download="rent-alnoud.ics";document.body.appendChild(a);a.click();a.remove()}
  toast(LX().calDone)}
/* ---- reports (print to PDF) ---- */
function openRep(){const x=LX();$("#repTitle").textContent=x.repT;
  $("#repBody").innerHTML=`<label class="rl"><span>${x.repPlot}</span><select id="repPlot"><option value="all">${x.repAll}</option>${["47","34","29"].map(p=>`<option value="${p}">${plotName(p)}</option>`).join("")}</select></label>
  <p class="muted small">${x.repHint}</p><div class="edbtns"><button type="button" class="pri" id="repGo">${x.repGo}</button><button type="button" id="repClose">${L().ed.cancel}</button></div>`;
  $("#repModal").classList.add("on");document.body.style.overflow="hidden"}
function buildReport(plot){const x=LX(),plots=plot==="all"?["47","34","29"]:[plot];
  let h=`<h1>${x.repTitle(plot==="all"?x.repAll:plotName(plot))}</h1><p class="rsub">${L().lessorLine} · ${x.repDate(dmy(iso(today)))}</p>`;let grand=0,gn=0;
  plots.forEach(p=>{const G=DATA.filter(c=>c.plot===p).sort((a,b)=>a.end<b.end?-1:1);if(!G.length)return;const tot=G.reduce((a,c)=>a+(+c.annual||0),0);grand+=tot;gn+=G.length;
    h+=`<table class="rt"><thead><tr class="rg"><th colspan="11">${plotName(p)} — ${G.length} — ${L().aed(fmt(tot))}</th></tr><tr>${x.repCols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>`+
    G.map((c,i)=>{const np=nextPay(c);return `<tr><td>${i+1}</td><td><b>${esc(unitOf(c))}</b></td><td>${esc(tenantOf(c))}</td><td class="n">${esc(c.phone||"—")}</td><td class="n">${c.no}</td><td class="n">${dmy(c.start)}</td><td class="n">${dmy(c.end)}</td><td class="n">${fmt(c.annual)}</td><td>${c.n} (${esc(methodOf(c))})</td><td class="n">${np?dmy(np.date)+" · "+fmt(np.amount):"—"}</td><td><span class="rp rp-${c.st.k}">${stText(c.st.k)}</span></td></tr>`}).join("")+
    `<tr class="rs"><td colspan="7">${x.repSum(G.length)}</td><td class="n">${fmt(tot)}</td><td colspan="3"></td></tr></tbody></table>`});
  if(plots.length>1)h+=`<p class="rgrand">${x.repSum(gn)}: <b>${L().aed(fmt(grand))}</b></p>`;
  return h}
function printReport(plot){const pa=$("#printArea");pa.innerHTML=buildReport(plot);closeModal("#repModal");document.body.classList.add("printing");
  const done=()=>{document.body.classList.remove("printing");pa.innerHTML="";window.removeEventListener("afterprint",done)};window.addEventListener("afterprint",done);
  setTimeout(()=>{window.print();setTimeout(()=>{if(document.body.classList.contains("printing")&&!matchMedia("print").matches)done()},1500)},150)}
/* ---- receipt ---- */
function drawReceipt(c,p,idx){const x=LX().r,W=1240,H=1000,M=90,rtl=lang==="ar";const cv=document.createElement("canvas");cv.width=W;cv.height=H;const g=cv.getContext("2d");
  g.fillStyle="#fff";g.fillRect(0,0,W,H);g.direction=rtl?"rtl":"ltr";g.textAlign="start";g.textBaseline="top";const X0=rtl?W-M:M,sign=rtl?-1:1;
  g.fillStyle="#1B2A41";g.fillRect(0,0,W,170);g.fillStyle="#fff";g.font=`700 52px ${FONT}`;g.fillText(x.t,X0,40);
  g.font=`400 24px ${FONT}`;g.fillStyle="#D5DBE1";g.fillText(LESSOR[lang],X0,112);
  const rno=`${c.no}-${idx+1}`;const rows=[[x.no,rno],[x.date,dmy(iso(today))],[x.from,tenantOf(c)],[x.amount,L().aed(fmt(p.amount))],[x.for,x.forV(unitOf(c),c.no,dmy(p.date))],[x.method,p.status==="cash"?x.cash:x.chq(p.chq,p.bank)]];
  let y=220;const labW=300,valX=X0+sign*(labW+20),valW=W-2*M-labW-20;
  const wrap=(t,mw)=>{const ws=String(t).split(" "),ls=[];let cur="";ws.forEach(w=>{const tt=cur?cur+" "+w:w;if(g.measureText(tt).width>mw&&cur){ls.push(cur);cur=w}else cur=tt});if(cur)ls.push(cur);return ls};
  rows.forEach(([k,v],i)=>{g.font=`600 30px ${FONT}`;const vl=wrap(v,valW);const h=vl.length*42+30;
    g.fillStyle="#5B6878";g.font=`400 26px ${FONT}`;g.fillText(k,X0,y+16);g.fillStyle=i===3?"#1F7A4D":"#1B2A41";g.font=`${i===3?700:500} ${i===3?36:30}px ${FONT}`;vl.forEach((l,j)=>g.fillText(l,valX,y+12+j*42));
    y+=h;g.fillStyle="#E3E7EC";g.fillRect(M,y,W-2*M,2)});
  const sy=H-150;g.fillStyle="#1B2A41";g.font=`500 26px ${FONT}`;
  g.fillText(x.sig,X0,sy);g.fillText(x.tsig,rtl?W/2-20:W/2+20,sy);g.fillStyle="#9AA4B1";g.fillRect(rtl?W/2+40:M,sy+80,W/2-M-40,2);g.fillRect(rtl?M:W/2+20,sy+80,W/2-M-40,2);
  return cv}
async function shareReceipt(no,idx){const c=DATA.find(x=>x.no===no);if(!c)return;const p=payments(c)[idx];if(!p)return;
  try{await document.fonts.ready}catch(e){}
  const cv=drawReceipt(c,p,idx);const jpg=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.92));const bytes=new Uint8Array(await jpg.arrayBuffer());
  const file=new File([jpegToPdf(bytes,cv.width,cv.height,true)],`receipt-${c.no}-${idx+1}.pdf`,{type:"application/pdf"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]})}else{const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove()}}catch(err){if(err&&err.name!=="AbortError")toast(L().waErr)}
  if(p.status==="pending"&&confirm(LX().r.mark)){const list=ensurePayments(c);const k=list.findIndex(q=>q.date===p.date&&+q.amount===+p.amount);if(k>=0){list[k].status="received";await savePayments(c)}}}
/* ---- events ---- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-renew],[data-pay],[data-addpay],[data-rcpt],[data-quick],[data-duetab],#tDue,#tRep,#tCal,#pyCancel,#pyDel,#dueClose,#repGo,#repClose");if(!t)return;
  if(t.dataset.renew)openEditor(t.dataset.renew,"renew");
  else if(t.dataset.pay){const [no,i]=t.dataset.pay.split("|");openPay(no,+i)}
  else if(t.dataset.addpay)openPay(t.dataset.addpay,-1);
  else if(t.dataset.rcpt){const [no,i]=t.dataset.rcpt.split("|");shareReceipt(no,+i)}
  else if(t.dataset.quick){const [no,i,s]=t.dataset.quick.split("|");quickStatus(no,+i,s)}
  else if(t.dataset.duetab){if($("#dueModal").classList.contains("on")){dueTab=t.dataset.duetab;drawDue()}else openDue(t.dataset.duetab)}
  else if(t.id==="tDue")openDue("d30");
  else if(t.id==="tRep")openRep();
  else if(t.id==="tCal")exportIcs();
  else if(t.id==="pyCancel")closeModal("#pyModal");
  else if(t.id==="pyDel"){if(!confirm(LX().confirmDelPay))return;const c=DATA.find(x=>x.no===pyNo);const list=ensurePayments(c);list.splice(pyIdx,1);c.n=Math.max(1,list.length);closeModal("#pyModal");await savePayments(c)}
  else if(t.id==="dueClose")closeModal("#dueModal");
  else if(t.id==="repGo")printReport($("#repPlot").value);
  else if(t.id==="repClose")closeModal("#repModal");
});

</script>
